<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Spring Logo -->
  <defs>
    <linearGradient id="springGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#68A063;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D8043;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Spring coil base -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#springGradient)" stroke-width="2"/>

  <!-- Spring coil loops -->
  <path d="M 50 15 Q 65 25 65 40 Q 65 55 50 65 Q 35 75 35 60"
        fill="none" stroke="url(#springGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner leaf detail -->
  <path d="M 50 50 Q 55 45 60 50" fill="none" stroke="#68A063" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 50 50 Q 55 55 60 50" fill="none" stroke="#68A063" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Decorative leaves -->
  <ellipse cx="35" cy="25" rx="4" ry="8" fill="#68A063" opacity="0.6" transform="rotate(-30 35 25)"/>
  <ellipse cx="65" cy="25" rx="4" ry="8" fill="#68A063" opacity="0.6" transform="rotate(30 65 25)"/>
  <ellipse cx="30" cy="50" rx="4" ry="8" fill="#68A063" opacity="0.6" transform="rotate(-60 30 50)"/>
  <ellipse cx="70" cy="50" rx="4" ry="8" fill="#68A063" opacity="0.6" transform="rotate(60 70 50)"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#3D8043"/>
</svg>
