<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Coffee Cup -->
  <defs>
    <linearGradient id="javaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C05621;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cup Body -->
  <path d="M 25 30 Q 25 25 30 25 L 70 25 Q 75 25 75 30 L 75 60 Q 75 70 65 70 L 35 70 Q 25 70 25 60 Z"
        fill="url(#javaGradient)" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Handle -->
  <path d="M 77 35 Q 88 35 88 50 Q 88 65 77 65"
        fill="none" stroke="url(#javaGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Coffee inside -->
  <ellipse cx="50" cy="35" rx="20" ry="4" fill="#6F4E37" opacity="0.8"/>

  <!-- Saucer -->
  <ellipse cx="50" cy="72" rx="28" ry="8" fill="#D4A574" stroke="#8B4513" stroke-width="1"/>

  <!-- Highlight -->
  <ellipse cx="40" cy="50" rx="8" ry="12" fill="white" opacity="0.3"/>

  <!-- Steam wisps -->
  <path d="M 35 20 Q 33 15 35 10" stroke="#ED8936" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 50 18 Q 48 12 50 6" stroke="#ED8936" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 65 20 Q 67 15 65 10" stroke="#ED8936" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
