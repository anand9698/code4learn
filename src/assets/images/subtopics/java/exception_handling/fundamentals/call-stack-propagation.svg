<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 268" width="340" height="268" font-family="system-ui, Segoe UI, sans-serif" font-size="16">
  <title>How an exception travels</title>
  <desc>The JVM looks for a matching handler as the call stack unwinds.</desc>
  <rect x="0.5" y="0.5" width="339" height="267" rx="8" fill="#fff5e6" stroke="#dfbca0"/>
  <image id="code4learn-watermark" x="12%" y="8%" width="76%" height="84%" opacity="0.18" href="data:image/png;base64,"/>
  <text x="12" y="24" fill="#2c1810" font-weight="700">How an exception travels</text>
  <rect x="10" y="36" width="320" height="69" rx="6" fill="#fff" fill-opacity="0.65" stroke="#dfbca0"/>
  <rect x="18" y="40" width="22" height="24" rx="4" fill="#8d3c0c" stroke="none"/>
  <text x="29" y="58" fill="#fff" font-weight="700" text-anchor="middle">1</text>
  <text x="47" y="58" fill="#8d3c0c" font-weight="700">A method throws</text>
  <text x="47" y="77" fill="#2c1810">Normal execution stops where the</text>
  <text x="47" y="96" fill="#2c1810">failure occurs.</text>
  <rect x="10" y="112" width="320" height="69" rx="6" fill="#fff" fill-opacity="0.65" stroke="#dfbca0"/>
  <rect x="18" y="116" width="22" height="24" rx="4" fill="#8d3c0c" stroke="none"/>
  <text x="29" y="134" fill="#fff" font-weight="700" text-anchor="middle">2</text>
  <text x="47" y="134" fill="#8d3c0c" font-weight="700">Look for a handler</text>
  <text x="47" y="153" fill="#2c1810">Java checks for a matching catch and</text>
  <text x="47" y="172" fill="#2c1810">unwinds to the caller when needed.</text>
  <rect x="10" y="188" width="320" height="69" rx="6" fill="#fff" fill-opacity="0.65" stroke="#dfbca0"/>
  <rect x="18" y="192" width="22" height="24" rx="4" fill="#8d3c0c" stroke="none"/>
  <text x="29" y="210" fill="#fff" font-weight="700" text-anchor="middle">3</text>
  <text x="47" y="210" fill="#8d3c0c" font-weight="700">Handle or exit</text>
  <text x="47" y="229" fill="#2c1810">A matching handler runs. Without one,</text>
  <text x="47" y="248" fill="#2c1810">the affected thread ends.</text>
</svg>
