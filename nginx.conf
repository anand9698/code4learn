server {
  listen 80;
  server_tokens off; # Hide Nginx version for security

  # Set the root directory for Nginx.
  # Since we copied the Angular app to /usr/share/nginx/html/Syllabus,
  # the root should be the parent directory: /usr/share/nginx/html.
  root /usr/share/nginx/html;

  location /Syllabus/assets/ {
    try_files $uri =404;
  }

  # Configuration for the Angular application served under /Syllabus/
  location /Syllabus/ {
    # Try to serve the requested file directly, or a directory index.
    # If not found, fall back to index.html for client-side routing.
    # This ensures that Angular's router can handle the URL.
    try_files $uri $uri/ /Syllabus/index.html;
  }

  # Redirect requests to the root path (e.g., http://localhost/)
  # to the Angular application's base-href path (http://localhost/Syllabus/).
  # This is a common practice when an Angular app uses a base-href.
  location / {
    return 302 /Syllabus/;
  }
}
